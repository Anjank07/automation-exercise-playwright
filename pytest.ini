[pytest]
; base_url is what pytest-base-url (installed as a dependency of
; pytest-playwright) reads to resolve every relative page.goto("/...") call.
; This is the ONE place the target site is configured — see README for why
; it isn't duplicated anywhere else.
base_url = https://automationexercise.com

testpaths = tests

; --strict-markers makes an unregistered @pytest.mark.whatever a hard error
; instead of a silent no-op typo. Cheap safety net once you start tagging
; tests (ui/api/smoke/regression) for selective CI runs.
addopts = -ra --strict-markers

markers =
    ui: UI tests that drive a real browser
    api: API tests that only make HTTP calls, no browser involved

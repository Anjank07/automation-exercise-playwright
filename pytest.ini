[pytest]
; base_url is what pytest-base-url (installed as a dependency of
; pytest-playwright) reads to resolve every relative page.goto("/...") call.
; This is the ONE place the target site is configured — see README for why
; it isn't duplicated anywhere else.
base_url = https://automationexercise.com

testpaths = tests

; --strict-markers makes an unregistered @pytest.mark.whatever a hard error
; instead of a silent no-op typo. Cheap safety net once you start tagging
; tests (ui/api/smoke/regression) for selective CI runs.
;
; --reruns: automationexercise.com is a shared public site with live ads
; and a WAF. Under a full-suite run it occasionally serves a page whose
; `load` event never fires within 30s, drops a request, or (see
; helpers/anti_bot.py) challenges the runner with a "please wait, verifying"
; interstitial instead of the app. That's infrastructure noise, not a
; product bug — so we retry, but ONLY on these specific, recognisable
; failure shapes (--only-rerun). A plain assertion failure is a real
; finding and is never retried; it fails on the first attempt as it should.
addopts =
    -ra
    --strict-markers
    --reruns 2
    --reruns-delay 3
    --only-rerun "TimeoutError"
    --only-rerun "Timeout .* exceeded"
    --only-rerun "playwright._impl._errors.TimeoutError"
    --only-rerun "AntiBotChallengeError"

; ui / api are applied automatically from the folder (see root conftest.py);
; smoke is chosen by hand — it's the critical-path subset CI runs on every push.
markers =
    ui: UI tests that drive a real browser (auto-applied to tests/ui)
    api: API tests that only make HTTP calls, no browser involved (auto-applied to tests/api)
    smoke: critical-path subset that gates every push and pull request

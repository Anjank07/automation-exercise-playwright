# CI for the Automation Exercise suite.
#
# Design — a fast quality gate on every change, the full picture nightly:
#
#   push / pull_request   lint  ->  API suite  +  UI smoke (Chromium)
#   nightly / manual      lint  ->  API suite  +  full UI regression
#                                                  (Chromium AND Firefox)
#
# Why split it this way: the full UI suite drives a real browser against a
# shared public site and takes minutes; the API suite and a critical-path
# UI smoke subset (@pytest.mark.smoke) take well under that and catch most
# breakage. Running everything, in two browsers, on every push would slow
# feedback and hammer someone else's site for little extra signal.
#
# Every test job writes a pass/fail table to the run's Summary page and
# publishes a self-contained HTML report; UI jobs also embed a screenshot of
# each failure in that report and keep its Playwright trace (open with
# `playwright show-trace trace.zip` or at trace.playwright.dev).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC = 07:00 IST, daily
  workflow_dispatch: # "Run workflow" button: on-demand full regression

permissions:
  contents: read # least privilege: this workflow only reads the repo

concurrency:
  # A newer push to the same branch cancels the in-flight run — no point
  # finishing a run for a commit that has already been superseded.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # --output-format=github turns each finding into an inline annotation
      # on the offending line of the PR diff.
      - run: ruff check --output-format=github .

  api:
    name: API tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # No `playwright install`: APIRequestContext needs the Playwright
      # driver (bundled in the pip wheel) but no browser binary.
      - name: Run API suite
        run: >-
          pytest tests/api --junitxml=reports/junit.xml
          --html=reports/api-report.html --self-contained-html
      - name: Summarize results
        if: ${{ !cancelled() }}
        run: python scripts/ci_summary.py reports/junit.xml "API tests"
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: reports/
          retention-days: 14

  ui-smoke:
    name: UI smoke (chromium)
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run UI smoke suite
        # -n auto: one xdist worker per available CPU, not a hardcoded
        # number. A hardcoded worker count that happens to exceed the
        # runner's actual cores oversubscribes it — N browser processes
        # competing for fewer cores than that run slower across the board,
        # which is exactly how a CPU-starved runner turns into spurious
        # timeouts under load. auto sidesteps guessing at GitHub's current
        # runner spec (it can and does change) entirely.
        run: >-
          pytest tests/ui -m smoke --browser chromium -n auto
          --tracing retain-on-failure --screenshot only-on-failure
          --junitxml=reports/junit.xml
          --html=reports/ui-smoke-report.html --self-contained-html
      - name: Summarize results
        if: ${{ !cancelled() }}
        run: python scripts/ci_summary.py reports/junit.xml "UI smoke (chromium)"
      - name: Upload report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-chromium
          path: |
            reports/
            test-results/
          retention-days: 14

  ui-regression:
    name: UI regression (${{ matrix.browser }})
    needs: lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let both browsers finish even if one fails: "fails in Firefox only"
      # is itself the finding, and fail-fast would hide it.
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run full UI suite
        # -n auto (see ui-smoke above for why, not a hardcoded count).
        # Tests are independent — each gets its own browser context and
        # uniquely-emailed user — so they parallelise safely regardless of
        # worker count.
        run: >-
          pytest tests/ui --browser ${{ matrix.browser }} -n auto
          --tracing retain-on-failure --screenshot only-on-failure
          --junitxml=reports/junit.xml
          --html=reports/ui-regression-${{ matrix.browser }}.html --self-contained-html
      - name: Summarize results
        if: ${{ !cancelled() }}
        run: python scripts/ci_summary.py reports/junit.xml "UI regression (${{ matrix.browser }})"
      - name: Upload report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-regression-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          retention-days: 14
